# Medis Touch / Midas Touch 2 Render Blueprint
#
# This Blueprint manages the existing midas-touch2 web service.
# The PostgreSQL instance is intentionally referenced but NOT declared here:
# it already exists in Render as midas-touch2-production-db and must not be
# recreated or destroyed by Blueprint changes.
#
# Runtime is Docker so the production image is deterministic and independent
# of Render's native Python runtime.

services:
  - type: web
    name: midas-touch2
    runtime: docker
    dockerfilePath: ./telegram-bridge/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health/db

    envVars:
      # IMPORTANT: the previous service had a literal placeholder here:
      # __LINK_MIDAS_TOUCH2_PRODUCTION_DB_IN_RENDER__
      # That is not a SQLAlchemy URL and caused the Alembic crash.
      - key: DATABASE_URL
        fromDatabase:
          name: midas-touch2-production-db
          property: connectionString

      # Secrets remain dashboard-managed and are intentionally not stored in Git.
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: GROUP_CHAT_ID
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: SUBSCRIPTION_PROVIDER_TOKEN
        sync: false

      - key: LOG_LEVEL
        value: "INFO"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "5"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: MAX_REQUEST_BODY_SIZE
        value: "10240"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: TELEGRAM_TIMEOUT_SECONDS
        value: "8"
      - key: TELEGRAM_MAX_RETRIES
        value: "3"
      - key: TELEGRAM_RETRY_MAX_WAIT_SECONDS
        value: "4"
      - key: PENDING_STALE_SECONDS
        value: "120"
      - key: SUBSCRIPTION_CURRENCY
        value: "XTR"
      - key: SUBSCRIPTION_PRICE_AMOUNT
        value: "500"
      - key: SUBSCRIPTION_PERIOD_DAYS
        value: "30"
      - key: SUBSCRIPTION_GRACE_PERIOD_DAYS
        value: "3"
      - key: SUBSCRIPTION_WARNING_HOURS_BEFORE_EXPIRY
        value: "24"
      - key: COPY_TRADING_CONFIRM_TTL_SECONDS
        value: "120"
      - key: COPY_FEED_MAX_SIGNALS
        value: "20"
