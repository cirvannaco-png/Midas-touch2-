# GitHub shadow Render blueprint — isolated from production.
# Do not reuse production Telegram credentials, webhook, or database.
# The free Render database slot is currently unavailable in the production workspace;
# create this Blueprint only after an isolated database is available.
databases:
  - name: midas-touch-github-shadow-db
    plan: free
    databaseName: midas_touch_github_shadow
    user: midas_touch_github_shadow

services:
  - type: web
    name: midas-touch-telegram-github-shadow
    runtime: docker
    dockerfilePath: ./telegram-bridge/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/db
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: midas-touch-github-shadow-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: GROUP_CHAT_ID
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: SUBSCRIPTION_PROVIDER_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: "INFO"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "5"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: MAX_REQUEST_BODY_SIZE
        value: "10240"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: TELEGRAM_TIMEOUT_SECONDS
        value: "8"
      - key: TELEGRAM_MAX_RETRIES
        value: "3"
      - key: TELEGRAM_RETRY_MAX_WAIT_SECONDS
        value: "4"
      - key: PENDING_STALE_SECONDS
        value: "120"
      - key: SUBSCRIPTION_CURRENCY
        value: "XTR"
      - key: SUBSCRIPTION_PRICE_AMOUNT
        value: "500"
      - key: SUBSCRIPTION_PERIOD_DAYS
        value: "30"
      - key: SUBSCRIPTION_GRACE_PERIOD_DAYS
        value: "3"
      - key: SUBSCRIPTION_WARNING_HOURS_BEFORE_EXPIRY
        value: "24"
      - key: COPY_TRADING_CONFIRM_TTL_SECONDS
        value: "120"
      - key: COPY_FEED_MAX_SIGNALS
        value: "20"
