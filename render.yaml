# ⚠️  READ BEFORE DEPLOYING ⚠️
# After "Deploy Blueprint" finishes syncing, the web service will build but
# will crash-loop on boot until you manually set BOT_TOKEN, CHAT_ID,
# ADMIN_CHAT_ID, and
# SECRET_KEY in the Render Dashboard (Service → Environment). These are
# marked `sync: false` below on purpose (Render never stores secrets in
# git), which means Blueprint sync creates the empty slots but does NOT
# populate them for you. `alembic upgrade head` (the first command the
# container runs) imports app.config, which fails fast with a pydantic
# ValidationError if any of the three are missing - so the deploy will
# never go healthy until this step is done, no matter how many times you
# redeploy.
databases:
  - name: midas-touch-github-shadow-db
    plan: free          # upgrade to starter/standard for production SLAs; free tier
                         # hard-deletes after 30 days regardless of usage/logins
    databaseName: midas_touch_github_shadow
    user: midas_touch_github_shadow

services:
  - type: web
    name: midas-touch-telegram-github-shadow
    runtime: docker
    dockerfilePath: ./telegram-bridge/Dockerfile
    # dockerContext sets the Docker build context to the repository root so
    # that COPY paths inside the Dockerfile (e.g. telegram-bridge/requirements.txt)
    # resolve correctly. Without this, Render defaults to the Dockerfile's own
    # directory and those paths fail.
    dockerContext: .
    plan: free          # upgrade to starter/standard for production SLAs; free web
                         # services spin down after 15 min idle (~1 min cold start)
    # Render readiness must include the persistence dependency. The root
    # liveness endpoint intentionally does not query the database.
    healthCheckPath: /health/db
    envVars:
      - key: DATABASE_URL
        # Render injects postgres:// -- config.py normalises it to
        # postgresql+asyncpg:// automatically (see DATABASE_URL validator).
        fromDatabase:
          name: medis-touch-db
          property: connectionString

      # --- secrets: set these in the Render dashboard, not here ---
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      # Telegram *user* id allowed to run admin commands (defaults to
      # ADMIN_CHAT_ID when unset). Lets the admin command the bot from
      # inside the group as well as the DM.
      - key: ADMIN_USER_ID
        sync: false
      # Optional second broadcast destination (the subscriber group).
      # Read it out of the service logs: every inbound update logs its chat_id.
      - key: GROUP_CHAT_ID
        sync: false
      - key: SECRET_KEY
        sync: false
      # Required — the container refuses to boot without it. Must match
      # ^[A-Za-z0-9_-]{1,256}$ (Telegram's setWebhook rule): generate with
      # `openssl rand -hex 32`, or run the render-secrets workflow.
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      # Real-currency payment provider token (Stripe etc., from @BotFather ->
      # Payments). Leave unset in the dashboard to use Telegram Stars (XTR)
      # instead — no external merchant account needed. Secret either way.
      - key: SUBSCRIPTION_PROVIDER_TOKEN
        sync: false

      # --- tuneable at deploy time, safe to version-control ---
      - key: LOG_LEVEL
        value: "INFO"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "5"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: MAX_REQUEST_BODY_SIZE
        value: "10240"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: TELEGRAM_TIMEOUT_SECONDS
        value: "8"
      - key: TELEGRAM_MAX_RETRIES
        value: "3"
      - key: TELEGRAM_RETRY_MAX_WAIT_SECONDS
        value: "4"
      - key: PENDING_STALE_SECONDS
        value: "120"
      - key: SUBSCRIPTION_CURRENCY
        value: "XTR"
      # Placeholder — set your real plan price before taking live payments.
      - key: SUBSCRIPTION_PRICE_AMOUNT
        value: "500"
      - key: SUBSCRIPTION_PERIOD_DAYS
        value: "30"
      - key: SUBSCRIPTION_GRACE_PERIOD_DAYS
        value: "3"
      - key: SUBSCRIPTION_WARNING_HOURS_BEFORE_EXPIRY
        value: "24"
      - key: COPY_TRADING_CONFIRM_TTL_SECONDS
        value: "120"
      - key: COPY_FEED_MAX_SIGNALS
        value: "20"
