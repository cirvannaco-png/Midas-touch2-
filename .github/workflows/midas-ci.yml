name: Midas Touch CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/telegram-bridge

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telegram-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-bridge/requirements-dev.txt

      - name: Install bridge test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run bridge tests
        env:
          BOT_TOKEN: "123456:test-token"
          CHAT_ID: "-1000000000"
          ADMIN_CHAT_ID: "777000777"
          SECRET_KEY: "test-secret-key"
          WEBHOOK_SECRET_TOKEN: "test-webhook-secret"
          DATABASE_URL: "sqlite+aiosqlite:///./ci_test.db"
          RATE_LIMIT_MAX_REQUESTS: "5"
          RATE_LIMIT_WINDOW_SECONDS: "60"
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            echo "=== $test_file ==="
            timeout 240 python -m pytest -q "$test_file"
          done

  research-tests:
    name: Research tools tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r telegram-bridge/requirements.txt pytest==9.1.1

      - name: Run tools tests
        env:
          BOT_TOKEN: "123456:test-token"
          CHAT_ID: "-1000000000"
          ADMIN_CHAT_ID: "777000777"
          SECRET_KEY: "test-secret-key"
          WEBHOOK_SECRET_TOKEN: "test-webhook-secret"
          DATABASE_URL: "sqlite+aiosqlite:///./ci_tools_test.db"
          RATE_LIMIT_MAX_REQUESTS: "5"
          RATE_LIMIT_WINDOW_SECONDS: "60"
        run: python -m pytest -q tools/tests

  mql5-structure:
    name: MQL5 structural validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate MQL5 include tree
        run: |
          python tools/validate_mql5.py EA
          python tools/validate_edge_lineage.py
          python tools/phase_a_d_manifest.py

  handbook-tests:
    name: Handbook reference tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install handbook dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r medis_touch/requirements-dev.txt

      - name: Run handbook tests
        run: python -m pytest -q medis_touch/tests

  bridge-quality:
    name: Bridge quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bridge development tooling
        run: python -m pip install --upgrade pip && python -m pip install -r telegram-bridge/requirements-dev.txt

      - name: Ruff
        run: ruff check telegram-bridge/app telegram-bridge/migrations telegram-bridge/scripts telegram-bridge/tests

      - name: Bandit
        run: bandit -r telegram-bridge/app telegram-bridge/scripts -q

      - name: Dependency audit
        run: pip-audit -r telegram-bridge/requirements.txt

      - name: Render secret contract tests
        env:
          BOT_TOKEN: "123456:ci-placeholder"
          CHAT_ID: "-1000000000"
          ADMIN_CHAT_ID: "777000777"
          SECRET_KEY: "ci-placeholder-secret"
        run: python telegram-bridge/scripts/render_sync_secrets.py --dry-run


  render-latency-benchmark:
    name: Render /signal latency benchmark
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [python-tests, research-tests, mql5-structure, handbook-tests, bridge-quality]
    steps:
      - name: Benchmark deployed baseline and optimized services
        env:
          BASE_URL: https://midas-touch2-basebench.onrender.com
          OPT_URL: https://midas-touch2-perf.onrender.com
          API_KEY: benchmark-secret
        run: |
          python - <<'PY'
          import json, statistics, time, os
          from urllib.request import Request, urlopen
          
          payload = {
              "symbol": "EURUSD",
              "direction": "BUY",
              "entry": 1.1000,
              "sl": 1.0950,
              "tp1": 1.1050,
              "tp2": 1.1100,
              "confidence": 80,
              "reasons": ["structure break confirmed", "liquidity sweep"],
              "timeframe": "M15",
          }
          
          API_KEY = os.environ["API_KEY"]
          BASE_URL = os.environ["BASE_URL"]
          OPT_URL = os.environ["OPT_URL"]
          
          def request(url, path="/"):
              req = Request(url.rstrip("/") + path)
              with urlopen(req, timeout=15) as resp:
                  return resp.status, resp.read()
          
          def signal(url, n):
              body = dict(payload, signal_id=f"ci-bench-{n}")
              req = Request(
                  url.rstrip("/") + "/signal",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json", "X-API-Key": API_KEY},
                  method="POST",
              )
              start = time.perf_counter()
              with urlopen(req, timeout=15) as resp:
                  response = json.loads(resp.read())
              return (time.perf_counter() - start) * 1000.0, response
          
          first = {}
          for name, url in [("baseline", BASE_URL), ("optimized", OPT_URL)]:
              start = time.perf_counter()
              status, _ = request(url, "/")
              first[name] = {"status": status, "ms": (time.perf_counter() - start) * 1000.0}
          
          results = {}
          fingerprints = {}
          for name, url in [("baseline", BASE_URL), ("optimized", OPT_URL)]:
              samples = []
              for i in range(100):
                  elapsed, response = signal(url, i)
                  if response.get("status") != "queued":
                      raise AssertionError(f"{name} /signal returned {response}")
                  fingerprints[name] = response["decision_fingerprint"]
                  samples.append(elapsed)
              samples.sort()
              def q(p):
                  return samples[max(0, int((len(samples) * p) + 0.999999) - 1)]
              results[name] = {
                  "p50_ms": statistics.median(samples),
                  "p95_ms": q(0.95),
                  "p99_ms": q(0.99),
                  "min_ms": samples[0],
                  "max_ms": samples[-1],
              }
          
          if fingerprints["baseline"] != fingerprints["optimized"]:
              raise AssertionError("signal equivalence failure: baseline and optimized fingerprints differ")
          
          print(json.dumps({"first_request": first, "warm_signal": results, "fingerprint_equivalent": True}, indent=2))
          PY
