name: Midas Touch CI

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - main
      - "hardening/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telegram-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-bridge/requirements.txt

      - name: Install bridge dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Run bridge tests
        env:
          BOT_TOKEN: "123456:test-token"
          CHAT_ID: "-1000000000"
          ADMIN_CHAT_ID: "777000777"
          SECRET_KEY: "test-secret-key"
          WEBHOOK_SECRET_TOKEN: "test-webhook-secret"
          DATABASE_URL: "sqlite+aiosqlite:///./ci_test.db"
          RATE_LIMIT_MAX_REQUESTS: "5"
          RATE_LIMIT_WINDOW_SECONDS: "60"
        run: python -m pytest -q ../telegram-bridge/tests

  research-tests:
    name: Research tools tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bridge dependencies and test runner
        run: python -m pip install --upgrade pip && python -m pip install -r telegram-bridge/requirements.txt pytest

      - name: Run tools tests
        env:
          BOT_TOKEN: "123456:test-token"
          CHAT_ID: "-1000000000"
          ADMIN_CHAT_ID: "777000777"
          SECRET_KEY: "test-secret-key"
          WEBHOOK_SECRET_TOKEN: "test-webhook-secret"
          DATABASE_URL: "sqlite+aiosqlite:///./ci_tools_test.db"
          RATE_LIMIT_MAX_REQUESTS: "5"
          RATE_LIMIT_WINDOW_SECONDS: "60"
        run: python -m pytest -q tools/tests

  mql5-structure:
    name: MQL5 structural validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate MQL5 include tree
        run: python tools/validate_mql5.py EA
