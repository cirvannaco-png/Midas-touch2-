name: MetaTrader 5 EA Compile

on:
  pull_request:
    branches:
      - main
    paths:
      - "EA/**"
      - ".github/workflows/mql5-compile.yml"
  push:
    branches:
      - main
    paths:
      - "EA/**"
      - ".github/workflows/mql5-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mql5-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile MedisTouch EA with MetaEditor
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe' -OutFile $installer
          if ((Get-Item $installer).Length -lt 1MB) {
            throw 'MetaTrader 5 installer download is unexpectedly small.'
          }

      - name: Install and initialize portable MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'MetaTrader5'
          $arguments = "/auto /path:`"$installDir`""
          $installerProcess = Start-Process -FilePath $installer -ArgumentList $arguments -PassThru
          $metaEditor = Join-Path $installDir 'metaeditor64.exe'
          $terminal = Join-Path $installDir 'terminal64.exe'
          $deadline = (Get-Date).AddMinutes(5)
          while ((!(Test-Path $metaEditor) -or !(Test-Path $terminal)) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
          }
          if (!(Test-Path $metaEditor) -or !(Test-Path $terminal)) {
            Write-Host "Installer process exited: $($installerProcess.HasExited)"
            if ($installerProcess.HasExited) { Write-Host "Installer exit code: $($installerProcess.ExitCode)" }
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | Select-Object -First 80 FullName
            throw 'MetaTrader installation did not provide both terminal64.exe and metaeditor64.exe.'
          }
          $includeFile = Join-Path $installDir 'MQL5/Include/Trade/Trade.mqh'
          if (!(Test-Path $includeFile)) {
            Write-Host 'Starting terminal once in portable mode to initialize its MQL5 data directory.'
            $terminalProcess = Start-Process -FilePath $terminal -ArgumentList '/portable' -PassThru
            Start-Sleep -Seconds 30
            if (!$terminalProcess.HasExited) {
              Stop-Process -Id $terminalProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }
          $mql5Root = $null
          $candidateRoot = Join-Path $installDir 'MQL5'
          if (Test-Path (Join-Path $candidateRoot 'Include/Trade/Trade.mqh')) {
            $mql5Root = $candidateRoot
          }
          $terminalDataRoot = Join-Path $env:APPDATA 'MetaQuotes/Terminal'
          if (!$mql5Root -and (Test-Path $terminalDataRoot)) {
            foreach ($terminalDir in (Get-ChildItem $terminalDataRoot -Directory -ErrorAction SilentlyContinue)) {
              $candidate = Join-Path $terminalDir.FullName 'MQL5'
              if (Test-Path (Join-Path $candidate 'Include/Trade/Trade.mqh')) { $mql5Root = $candidate; break }
            }
          }
          if (!$mql5Root) {
            Write-Host "Install root contents:"
            Get-ChildItem $installDir -Recurse -ErrorAction SilentlyContinue | Select-Object -First 100 FullName
            throw 'Standard MQL5 Include/Trade/Trade.mqh is missing after portable initialization.'
          }
          "METAEDITOR_PATH=$metaEditor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_MQL5_ROOT=$mql5Root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MetaEditor: $metaEditor"
          Write-Host "MQL5 data root: $mql5Root"

      - name: Stage EA and compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expertDir = Join-Path $env:MT5_MQL5_ROOT 'Experts/MidasTouch'
          New-Item -ItemType Directory -Path $expertDir -Force | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'EA/*') -Destination $expertDir -Recurse -Force
          $source = Join-Path $expertDir 'MedisTouch_v2.8.mq5'
          if (!(Test-Path $source)) {
            throw "EA source was not staged: $source"
          }
          $arguments = "/compile:`"$source`" /include:`"$env:MT5_MQL5_ROOT`" /log"
          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $arguments -Wait -PassThru
          Start-Sleep -Seconds 2
          $logPath = Join-Path $expertDir 'MedisTouch_v2.8.log'
          if (!(Test-Path $logPath)) {
            Get-ChildItem $expertDir -Recurse | Select-Object FullName
            throw 'MetaEditor did not produce its expected compile log.'
          }
          Copy-Item -Path $logPath -Destination (Join-Path $env:RUNNER_TEMP 'MedisTouch_v2.8.log') -Force
          $log = Get-Content -Path $logPath -Raw
          Write-Host $log
          $result = [regex]::Match($log, '(?im)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (!$result.Success) {
            throw 'Could not parse MetaEditor compile summary; refusing to treat an unknown result as success.'
          }
          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value
          if ($errors -gt 0) {
            throw "MetaEditor reported $errors compile errors and $warnings warnings."
          }
          if (!(Test-Path (Join-Path $expertDir 'MedisTouch_v2.8.ex5'))) {
            throw 'MetaEditor reported no compile errors but did not produce the expected EX5 artifact.'
          }
          "MetaEditor compile succeeded: errors=$errors warnings=$warnings" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($warnings -gt 0) {
            Write-Warning "Compilation succeeded with $warnings warning(s); review the uploaded compiler log."
          }

      - name: Compile partial-exit policy test with MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testSource = Join-Path $env:GITHUB_WORKSPACE 'EA/tests/PositionManagementPolicy.mq5'
          $expertTestDir = Join-Path $env:MT5_MQL5_ROOT 'Experts/MidasTouch/tests'
          New-Item -ItemType Directory -Path $expertTestDir -Force | Out-Null
          $stagedTest = Join-Path $expertTestDir 'PositionManagementPolicy.mq5'
          Copy-Item -Path $testSource -Destination $stagedTest -Force
          $arguments = "/compile:`"$stagedTest`" /include:`"$env:MT5_MQL5_ROOT`" /log"
          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $arguments -Wait -PassThru
          $testLog = Join-Path $expertTestDir 'PositionManagementPolicy.log'
          if (!(Test-Path $testLog)) { throw 'MetaEditor did not produce the partial-exit policy test compile log.' }
          $log = Get-Content -Path $testLog -Raw
          Write-Host $log
          $result = [regex]::Match($log, '(?im)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (!$result.Success) { throw 'Could not parse policy-test compile summary.' }
          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value
          if ($errors -gt 0) { throw "PositionManagementPolicy test has $errors compile errors and $warnings warnings." }
          if (!(Test-Path (Join-Path $expertTestDir 'PositionManagementPolicy.ex5'))) { throw 'Policy-test EX5 artifact was not produced.' }
          "PositionManagementPolicy test compiled: errors=$errors warnings=$warnings" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Compile account risk profile policy test with MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testSource = Join-Path $env:GITHUB_WORKSPACE 'EA/tests/AccountRiskProfilePolicy.mq5'
          $expertTestDir = Join-Path $env:MT5_MQL5_ROOT 'Experts/MidasTouch/tests'
          New-Item -ItemType Directory -Path $expertTestDir -Force | Out-Null
          $stagedTest = Join-Path $expertTestDir 'AccountRiskProfilePolicy.mq5'
          Copy-Item -Path $testSource -Destination $stagedTest -Force
          $arguments = "/compile:`"$stagedTest`" /include:`"$env:MT5_MQL5_ROOT`" /log"
          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $arguments -Wait -PassThru
          $testLog = Join-Path $expertTestDir 'AccountRiskProfilePolicy.log'
          if (!(Test-Path $testLog)) { throw 'MetaEditor did not produce the account-risk profile policy test compile log.' }
          $log = Get-Content -Path $testLog -Raw
          Write-Host $log
          $result = [regex]::Match($log, '(?im)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (!$result.Success) { throw 'Could not parse account-risk profile policy compile summary.' }
          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value
          if ($errors -gt 0) { throw "AccountRiskProfilePolicy test has $errors compile errors and $warnings warnings." }
          if (!(Test-Path (Join-Path $expertTestDir 'AccountRiskProfilePolicy.ex5'))) { throw 'Account-risk profile policy test EX5 artifact was not produced.' }
          "AccountRiskProfilePolicy test compiled: errors=$errors warnings=$warnings" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload MetaEditor compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metatrader5-compile-log
          path: ${{ runner.temp }}/MedisTouch_v2.8.log
          if-no-files-found: warn
          retention-days: 14
