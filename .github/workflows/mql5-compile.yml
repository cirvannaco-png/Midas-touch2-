name: MetaTrader 5 EA Compile

on:
  pull_request:
    branches:
      - main
    paths:
      - "EA/**"
      - ".github/workflows/mql5-compile.yml"
  push:
    branches:
      - main
    paths:
      - "EA/**"
      - ".github/workflows/mql5-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mql5-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile MedisTouch EA with MetaEditor
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe' -OutFile $installer
          if ((Get-Item $installer).Length -lt 1MB) {
            throw 'MetaTrader 5 installer download is unexpectedly small.'
          }

      - name: Install and initialize portable MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'MetaTrader5'
          $arguments = "/auto /path:`"$installDir`""
          $installerProcess = Start-Process -FilePath $installer -ArgumentList $arguments -PassThru
          $metaEditor = Join-Path $installDir 'metaeditor64.exe'
          $terminal = Join-Path $installDir 'terminal64.exe'
          $deadline = (Get-Date).AddMinutes(5)
          while ((!(Test-Path $metaEditor) -or !(Test-Path $terminal)) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
          }
          if (!(Test-Path $metaEditor) -or !(Test-Path $terminal)) {
            Write-Host "Installer process exited: $($installerProcess.HasExited)"
            if ($installerProcess.HasExited) { Write-Host "Installer exit code: $($installerProcess.ExitCode)" }
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | Select-Object -First 80 FullName
            throw 'MetaTrader installation did not provide both terminal64.exe and metaeditor64.exe.'
          }
          $includeFile = Join-Path $installDir 'MQL5/Include/Trade/Trade.mqh'
          if (!(Test-Path $includeFile)) {
            Write-Host 'Starting terminal once in portable mode to initialize its MQL5 data directory.'
            $terminalProcess = Start-Process -FilePath $terminal -ArgumentList '/portable' -PassThru
            Start-Sleep -Seconds 30
            if (!$terminalProcess.HasExited) {
              Stop-Process -Id $terminalProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }
          $mql5Root = $null
          $candidateRoot = Join-Path $installDir 'MQL5'
          if (Test-Path (Join-Path $candidateRoot 'Include/Trade/Trade.mqh')) {
            $mql5Root = $candidateRoot
          }
          $terminalDataRoot = Join-Path $env:APPDATA 'MetaQuotes/Terminal'
          if (!$mql5Root -and (Test-Path $terminalDataRoot)) {
            foreach ($terminalDir in (Get-ChildItem $terminalDataRoot -Directory -ErrorAction SilentlyContinue)) {
              $candidate = Join-Path $terminalDir.FullName 'MQL5'
              if (Test-Path (Join-Path $candidate 'Include/Trade/Trade.mqh')) { $mql5Root = $candidate; break }
            }
          }
          if (!$mql5Root) {
            Write-Host "Install root contents:"
            Get-ChildItem $installDir -Recurse -ErrorAction SilentlyContinue | Select-Object -First 100 FullName
            throw 'Standard MQL5 Include/Trade/Trade.mqh is missing after portable initialization.'
          }
          "METAEDITOR_PATH=$metaEditor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_MQL5_ROOT=$mql5Root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MetaEditor: $metaEditor"
          Write-Host "MQL5 data root: $mql5Root"

      - name: Stage EA and compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expertDir = Join-Path $env:MT5_MQL5_ROOT 'Experts/MidasTouch'
          New-Item -ItemType Directory -Path $expertDir -Force | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'EA/*') -Destination $expertDir -Recurse -Force
          $source = Join-Path $expertDir 'MedisTouch_v2.8.mq5'
          if (!(Test-Path $source)) {
            throw "EA source was not staged: $source"
          }
          $arguments = "/compile:`"$source`" /include:`"$env:MT5_MQL5_ROOT`" /log"
          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $arguments -Wait -PassThru
          Start-Sleep -Seconds 2
          $logPath = Join-Path $expertDir 'MedisTouch_v2.8.log'
          if (!(Test-Path $logPath)) {
            Get-ChildItem $expertDir -Recurse | Select-Object FullName
            throw 'MetaEditor did not produce its expected compile log.'
          }
          Copy-Item -Path $logPath -Destination (Join-Path $env:RUNNER_TEMP 'MedisTouch_v2.8.log') -Force
          $log = Get-Content -Path $logPath -Raw
          Write-Host $log
          $result = [regex]::Match($log, '(?im)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (!$result.Success) {
            throw 'Could not parse MetaEditor compile summary; refusing to treat an unknown result as success.'
          }
          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value
          if ($errors -gt 0) {
            throw "MetaEditor reported $errors compile errors and $warnings warnings."
          }
          if (!(Test-Path (Join-Path $expertDir 'MedisTouch_v2.8.ex5'))) {
            throw 'MetaEditor reported no compile errors but did not produce the expected EX5 artifact.'
          }
          "MetaEditor compile succeeded: errors=$errors warnings=$warnings" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($warnings -gt 0) {
            Write-Warning "Compilation succeeded with $warnings warning(s); review the uploaded compiler log."
          }

      - name: Compile companion chart indicator with MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $indicatorDir = Join-Path $env:MT5_MQL5_ROOT 'Indicators/MidasTouch'
          New-Item -ItemType Directory -Path $indicatorDir -Force | Out-Null
          $indicatorSource = Join-Path $env:GITHUB_WORKSPACE 'EA/MedisTouch_Indicator_v2.8.mq5'
          if (!(Test-Path $indicatorSource)) {
            throw "Companion indicator source is missing: $indicatorSource"
          }
          Copy-Item -Path $indicatorSource -Destination $indicatorDir -Force
          $indicatorIncludes = Join-Path $indicatorDir 'includes'
          New-Item -ItemType Directory -Path $indicatorIncludes -Force | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'EA/includes/*') -Destination $indicatorIncludes -Recurse -Force
          $stagedIndicator = Join-Path $indicatorDir 'MedisTouch_Indicator_v2.8.mq5'
          $arguments = "/compile:`"$stagedIndicator`" /include:`"$env:MT5_MQL5_ROOT`" /log"
          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $arguments -Wait -PassThru
          $indicatorLog = Join-Path $indicatorDir 'MedisTouch_Indicator_v2.8.log'
          if (!(Test-Path $indicatorLog)) {
            Get-ChildItem $indicatorDir -Recurse | Select-Object FullName
            throw 'MetaEditor did not produce the companion indicator compile log.'
          }
          $log = Get-Content -Path $indicatorLog -Raw
          Write-Host $log
          $result = [regex]::Match($log, '(?im)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (!$result.Success) {
            throw 'Could not parse companion indicator compile summary; refusing to treat an unknown result as success.'
          }
          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value
          if ($errors -gt 0) {
            throw "Companion indicator has $errors compile errors and $warnings warnings."
          }
          if (!(Test-Path (Join-Path $indicatorDir 'MedisTouch_Indicator_v2.8.ex5'))) {
            throw 'Indicator compile returned no errors but did not produce the expected EX5 artifact.'
          }
          "MetaEditor indicator compile succeeded: errors=$errors warnings=$warnings" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($warnings -gt 0) {
            Write-Warning "Companion indicator compiled with $warnings warning(s); review the compiler log."
          }

      - name: Compile read-only production runtime preflight script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptDir = Join-Path $env:MT5_MQL5_ROOT 'Scripts/MidasTouch'
          New-Item -ItemType Directory -Path $scriptDir -Force | Out-Null
          $source = Join-Path $env:GITHUB_WORKSPACE 'EA/tests/ProductionRuntimePreflight.mq5'
          if (!(Test-Path $source)) { throw "Runtime preflight script is missing: $source" }
          $staged = Join-Path $scriptDir 'ProductionRuntimePreflight.mq5'
          Copy-Item -Path $source -Destination $staged -Force
          $arguments = "/compile:`"$staged`" /include:`"$env:MT5_MQL5_ROOT`" /log"
          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $arguments -Wait -PassThru
          $logPath = Join-Path $scriptDir 'ProductionRuntimePreflight.log'
          if (!(Test-Path $logPath)) { throw 'MetaEditor did not produce the runtime preflight compile log.' }
          $log = Get-Content -Path $logPath -Raw
          Write-Host $log
          $result = [regex]::Match($log, '(?im)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (!$result.Success) { throw 'Could not parse runtime preflight compile summary.' }
          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value
          if ($errors -gt 0) { throw "ProductionRuntimePreflight has $errors compile errors and $warnings warnings." }
          if (!(Test-Path (Join-Path $scriptDir 'ProductionRuntimePreflight.ex5'))) { throw 'Runtime preflight EX5 artifact was not produced.' }
          "ProductionRuntimePreflight compiled: errors=$errors warnings=$warnings" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Compile partial-exit policy test with MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testSource = Join-Path $env:GITHUB_WORKSPACE 'EA/tests/PositionManagementPolicy.mq5'
          $expertTestDir = Join-Path $env:MT5_MQL5_ROOT 'Experts/MidasTouch/tests'
          New-Item -ItemType Directory -Path $expertTestDir -Force | Out-Null
          $stagedTest = Join-Path $expertTestDir 'PositionManagementPolicy.mq5'
          Copy-Item -Path $testSource -Destination $stagedTest -Force
          $arguments = "/compile:`"$stagedTest`" /include:`"$env:MT5_MQL5_ROOT`" /log"
          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $arguments -Wait -PassThru
          $testLog = Join-Path $expertTestDir 'PositionManagementPolicy.log'
          if (!(Test-Path $testLog)) { throw 'MetaEditor did not produce the partial-exit policy test compile log.' }
          $log = Get-Content -Path $testLog -Raw
          Write-Host $log
          $result = [regex]::Match($log, '(?im)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (!$result.Success) { throw 'Could not parse policy-test compile summary.' }
          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value
          if ($errors -gt 0) { throw "PositionManagementPolicy test has $errors compile errors and $warnings warnings." }
          if (!(Test-Path (Join-Path $expertTestDir 'PositionManagementPolicy.ex5'))) { throw 'Policy-test EX5 artifact was not produced.' }
          "PositionManagementPolicy test compiled: errors=$errors warnings=$warnings" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Compile account risk profile policy test with MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testSource = Join-Path $env:GITHUB_WORKSPACE 'EA/tests/AccountRiskProfilePolicy.mq5'
          $expertTestDir = Join-Path $env:MT5_MQL5_ROOT 'Experts/MidasTouch/tests'
          New-Item -ItemType Directory -Path $expertTestDir -Force | Out-Null
          $stagedTest = Join-Path $expertTestDir 'AccountRiskProfilePolicy.mq5'
          Copy-Item -Path $testSource -Destination $stagedTest -Force
          $arguments = "/compile:`"$stagedTest`" /include:`"$env:MT5_MQL5_ROOT`" /log"
          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $arguments -Wait -PassThru
          $testLog = Join-Path $expertTestDir 'AccountRiskProfilePolicy.log'
          if (!(Test-Path $testLog)) { throw 'MetaEditor did not produce the account-risk profile policy test compile log.' }
          $log = Get-Content -Path $testLog -Raw
          Write-Host $log
          $result = [regex]::Match($log, '(?im)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (!$result.Success) { throw 'Could not parse account-risk profile policy compile summary.' }
          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value
          if ($errors -gt 0) { throw "AccountRiskProfilePolicy test has $errors compile errors and $warnings warnings." }
          if (!(Test-Path (Join-Path $expertTestDir 'AccountRiskProfilePolicy.ex5'))) { throw 'Account-risk profile policy test EX5 artifact was not produced.' }
          "AccountRiskProfilePolicy test compiled: errors=$errors warnings=$warnings" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Compile dynamic-stop policy test with MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testSource = Join-Path $env:GITHUB_WORKSPACE 'EA/tests/DynamicStopEngine.mq5'
          $expertTestDir = Join-Path $env:MT5_MQL5_ROOT 'Experts/MidasTouch/tests'
          New-Item -ItemType Directory -Path $expertTestDir -Force | Out-Null
          $stagedTest = Join-Path $expertTestDir 'DynamicStopEngine.mq5'
          Copy-Item -Path $testSource -Destination $stagedTest -Force
          $arguments = "/compile:`"$stagedTest`" /include:`"$env:MT5_MQL5_ROOT`" /log"
          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $arguments -Wait -PassThru
          $testLog = Join-Path $expertTestDir 'DynamicStopEngine.log'
          if (!(Test-Path $testLog)) { throw 'MetaEditor did not produce the dynamic-stop policy test compile log.' }
          $log = Get-Content -Path $testLog -Raw
          Write-Host $log
          $result = [regex]::Match($log, '(?im)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (!$result.Success) { throw 'Could not parse dynamic-stop policy test compile summary.' }
          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value
          if ($errors -gt 0) { throw "DynamicStopEngine test has $errors compile errors and $warnings warnings." }
          if (!(Test-Path (Join-Path $expertTestDir 'DynamicStopEngine.ex5'))) { throw 'DynamicStopEngine test EX5 artifact was not produced.' }
          "DynamicStopEngine test compiled: errors=$errors warnings=$warnings" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Compile opposing-position policy test with MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testSource = Join-Path $env:GITHUB_WORKSPACE 'EA/tests/OpposingPositionPolicy.mq5'
          $expertTestDir = Join-Path $env:MT5_MQL5_ROOT 'Experts/MidasTouch/tests'
          New-Item -ItemType Directory -Path $expertTestDir -Force | Out-Null
          $stagedTest = Join-Path $expertTestDir 'OpposingPositionPolicy.mq5'
          Copy-Item -Path $testSource -Destination $stagedTest -Force
          $arguments = "/compile:`"$stagedTest`" /include:`"$env:MT5_MQL5_ROOT`" /log"
          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $arguments -Wait -PassThru
          $testLog = Join-Path $expertTestDir 'OpposingPositionPolicy.log'
          if (!(Test-Path $testLog)) { throw 'MetaEditor did not produce the opposing-position policy compile log.' }
          $log = Get-Content -Path $testLog -Raw
          Write-Host $log
          $result = [regex]::Match($log, '(?im)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if (!$result.Success) { throw 'Could not parse opposing-position policy compile summary.' }
          $errors = [int]$result.Groups[1].Value
          $warnings = [int]$result.Groups[2].Value
          if ($errors -gt 0) { throw "OpposingPositionPolicy test has $errors compile errors and $warnings warnings." }
          if (!(Test-Path (Join-Path $expertTestDir 'OpposingPositionPolicy.ex5'))) { throw 'OpposingPositionPolicy test EX5 artifact was not produced.' }
          "OpposingPositionPolicy test compiled: errors=$errors warnings=$warnings" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Execute MQL5 policy tests in the native Strategy Tester
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'MetaTrader5'
          $terminal = Join-Path $installDir 'terminal64.exe'
          $mql5Root = [System.IO.Path]::GetFullPath($env:MT5_MQL5_ROOT)
          $portableRoot = [System.IO.Path]::GetFullPath((Join-Path $installDir 'MQL5'))
          $portableMode = $mql5Root.StartsWith($portableRoot, [System.StringComparison]::OrdinalIgnoreCase)
          $reportDir = Join-Path $installDir 'reports'
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
          if (!(Test-Path $terminal)) { throw "MetaTrader terminal missing: $terminal" }

          $testNames = @('PositionManagementPolicy', 'AccountRiskProfilePolicy', 'DynamicStopEngine', 'OpposingPositionPolicy')
          foreach ($testName in $testNames) {
            $expert = Join-Path $mql5Root ("Experts/MidasTouch/tests/" + $testName + ".ex5")
            if (!(Test-Path $expert)) { throw "Compiled policy-test artifact missing: $expert" }

            $reportName = "policy-$testName"
            $reportPath = Join-Path $reportDir ($reportName + '.htm')
            if (Test-Path $reportPath) { Remove-Item $reportPath -Force }
            $configPath = Join-Path $env:RUNNER_TEMP ($reportName + '.ini')
            $config = @(
              '[Common]',
              'ProxyEnable=0',
              'NewsEnable=0',
              '',
              '[Experts]',
              'AllowLiveTrading=0',
              'AllowDllImport=0',
              'Enabled=1',
              '',
              '[Tester]',
              ("Expert=MidasTouch\tests\" + $testName),
              'Symbol=EURUSD',
              'Period=M1',
              'Model=3',
              'Optimization=0',
              'Login=0',
              'Deposit=10000',
              'Currency=USD',
              'Leverage=1:100',
              'ExecutionMode=0',
              'UseLocal=1',
              'UseRemote=0',
              'UseCloud=0',
              ("Report=reports\" + $reportName + '.htm'),
              'ReplaceReport=1',
              'ShutdownTerminal=1'
            )
            $config | Set-Content -Path $configPath -Encoding ASCII

            $startedAt = Get-Date
            $terminalArgs = "/config:`"$configPath`""
            if ($portableMode) { $terminalArgs += ' /portable' }
            Write-Host "Running $testName in MetaTrader 5 Strategy Tester (math-calculation mode; no account login or market orders)."
            $process = Start-Process -FilePath $terminal -ArgumentList $terminalArgs -PassThru
            $deadline = (Get-Date).AddMinutes(3)
            while (!$process.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              $process.Refresh()
            }
            $process.Refresh()
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "MetaTrader Strategy Tester did not exit within three minutes for $testName."
            }
            if ($process.ExitCode -ne 0) {
              throw "MetaTrader terminal exited with code $($process.ExitCode) while running $testName."
            }

            $roots = @($installDir, (Join-Path $env:APPDATA 'MetaQuotes')) |
              Where-Object { Test-Path $_ } | Select-Object -Unique
            $testLogLines = @()
            foreach ($root in $roots) {
              $logFiles = Get-ChildItem -Path $root -Recurse -File -Filter '*.log' -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -ge $startedAt.AddMinutes(-1) }
              foreach ($logFile in $logFiles) {
                $matches = Select-String -Path $logFile.FullName -Pattern @("$testName tests:", "FAIL:", "TRACE ", "SYMBOL_DIAG")
                foreach ($match in $matches) {
                  $testLogLines += [PSCustomObject]@{ File = $logFile.FullName; Line = $match.Line }
                }
              }
            }
            $testLogLines | ForEach-Object { Write-Host ("TEST_LOG " + $_.File + ": " + $_.Line) }
            $passing = @($testLogLines | Where-Object { $_.Line.Contains("$testName tests: 0 failure(s)") })
            if ($passing.Count -eq 0) {
              throw "No successful native Strategy Tester assertion summary found for $testName. The test must print '$testName tests: 0 failure(s)'."
            }
            if (!(Test-Path $reportPath)) {
              throw "Strategy Tester did not produce its report for $testName at $reportPath."
            }
            $reportContent = Get-Content -Path $reportPath -Raw
            if ($reportContent.Length -lt 100) {
              throw "Strategy Tester report for $testName is unexpectedly small."
            }
            Write-Host "PASS: $testName executed by Strategy Tester; zero assertion failures; report produced."
            "Native Strategy Tester policy test passed: $testName; zero assertion failures." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload native Strategy Tester reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metatrader5-policy-test-evidence
          path: |
            ${{ runner.temp }}/MetaTrader5/reports/**
            ${{ runner.temp }}/MetaTrader5/Tester/logs/**
            ${{ runner.temp }}/MetaTrader5/Tester/Agent-*/logs/**
            ${{ runner.temp }}/MetaTrader5/MQL5/Experts/MidasTouch/tests/*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload MetaEditor compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metatrader5-compile-log
          path: ${{ runner.temp }}/MedisTouch_v2.8.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native Strategy Tester policy reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metatrader5-policy-tester-evidence
          path: |
            ${{ runner.temp }}/MetaTrader5/reports/policy-*.htm
            ${{ runner.temp }}/MetaTrader5/MQL5/Experts/MidasTouch/tests/*.log
            ${{ runner.temp }}/MetaTrader5/Tester/logs/*.log
            ${{ runner.temp }}/MetaTrader5/Tester/Agent-*/logs/*.log
          if-no-files-found: warn
          retention-days: 30
