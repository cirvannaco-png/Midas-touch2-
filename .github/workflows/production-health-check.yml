name: Midas Touch Production Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-health-check.yml"

permissions:
  contents: read

concurrency:
  group: midas-production-health-check
  cancel-in-progress: false

jobs:
  service-database-health:
    name: Verify deployed service and live database connection
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      # Keep the check aligned with production maintenance; do not pin a stale Render hostname.
      BRIDGE_BASE_URL: ${{ secrets.BRIDGE_BASE_URL }}
    steps:
      - name: Verify execution ledger endpoint requires authentication
        shell: bash
        run: |
          set -euo pipefail
          : "${BRIDGE_BASE_URL:?Missing GitHub Actions secret BRIDGE_BASE_URL}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          url="${BRIDGE_BASE_URL%/}/execution-ledger/health"

          # Render Free instances may need a cold-start window. Retry only this
          # read-only unauthenticated probe; no action endpoint is replayed.
          http_code="000"
          for attempt in $(seq 1 6); do
            http_code="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output "$response_file" --write-out '%{http_code}' "$url" 2>/dev/null || true)"
            if [[ "$http_code" == "422" ]]; then
              echo "PASS: production execution-ledger health route rejects requests missing X-API-Key."
              exit 0
            fi
            echo "Attempt ${attempt}/6: unauthenticated route probe returned HTTP ${http_code}."
            sleep 5
          done
          echo "::error::Expected HTTP 422 from unauthenticated execution-ledger health route; last HTTP ${http_code}. Check BRIDGE_BASE_URL and service availability."
          exit 1
      - name: Probe DB-backed production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="${BRIDGE_BASE_URL%/}/health/db"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in $(seq 1 12); do
            http_code="$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
              --output "$response_file" --write-out '%{http_code}' "$url" 2>/dev/null || true)"

            if [[ "$http_code" == "200" ]] && python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  payload = json.load(stream)
          except (OSError, json.JSONDecodeError):
              raise SystemExit(1)

          if payload.get("status") != "online" or payload.get("database") != "connected":
              print(
                  "Health response is not fully ready: "
                  f"status={payload.get('status')!r}, "
                  f"database={payload.get('database')!r}, "
                  f"version={payload.get('version')!r}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(
              "PASS: production service is online and a live SELECT 1 succeeded; "
              f"version={payload.get('version', 'unknown')}"
          )
          PY
            then
              exit 0
            fi

            echo "Attempt ${attempt}/12: HTTP ${http_code}; waiting for online + connected."
            sleep 10
          done

          echo "::error::Production service did not report status=online and database=connected after 12 attempts."
          if [[ -s "$response_file" ]]; then
            python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  payload = json.load(stream)
          except (OSError, json.JSONDecodeError):
              print("Last health response was not valid JSON.")
          else:
              print(
                  "Last health fields: "
                  f"status={payload.get('status')!r}, "
                  f"database={payload.get('database')!r}, "
                  f"version={payload.get('version')!r}"
              )
          PY
          fi
          exit 1
