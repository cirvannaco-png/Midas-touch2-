name: Midas Touch Production Health Check

on:
  pull_request:
    paths:
      - ".github/workflows/production-health-check.yml"
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-health-check.yml"

permissions:
  contents: read

concurrency:
  group: midas-production-health-check
  cancel-in-progress: false

jobs:
  workflow-static-validation:
    if: ${{ github.event_name == 'pull_request' }}
    name: Validate health workflow without production credentials
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Parse YAML and assert fail-closed release gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path(".github/workflows/production-health-check.yml")
          document = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          assert isinstance(document, dict), "workflow document must be a mapping"
          assert "workflow_dispatch" in document["on"], "manual read-only preflight trigger missing"
          assert "schedule" in document["on"], "periodic health trigger missing"
          assert "pull_request" in document["on"], "static PR validation trigger missing"
          jobs = document["jobs"]
          health = jobs["service-database-health"]
          assert health["environment"] == "production", "health gate must use protected production environment"
          assert isinstance(health["if"], str) and "pull_request" in health["if"] and "!=" in health["if"], "production health calls must not run on PRs"
          runs = "\n".join(step.get("run", "") for step in health["steps"])
          for required in (
              "BRIDGE_BASE_URL: https://midas-touch2.onrender.com",
              "secrets.BRIDGE_API_KEY",
              "execution_ledger",
              "database",
              "status",
              "401|403|422",
              "X-API-Key",
              "/execution-ledger/health",
              "/health/db",
          ):
              assert required in path.read_text(encoding="utf-8"), f"required release-gate contract missing: {required}"
          static = jobs["workflow-static-validation"]
          assert isinstance(static["if"], str) and "pull_request" in static["if"] and "==" in static["if"], "static validation job must be PR-only"
          assert all("BRIDGE_API_KEY" not in step.get("env", {}) for step in static["steps"]), "production key must never enter PR validation"
          print("PASS: valid YAML; authenticated ledger, unauthenticated denial, DB-backed probe, and PR secret isolation gates present.")
          PY

  service-database-health:
    if: ${{ github.event_name != 'pull_request' }}
    name: Verify authenticated execution ledger and live database
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Validate production bridge secrets without printing them
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BRIDGE_BASE_URL:?BRIDGE_BASE_URL is not configured in workflow}"
          : "${BRIDGE_API_KEY:?Missing GitHub Actions environment secret BRIDGE_API_KEY}"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw = os.environ["BRIDGE_BASE_URL"].strip()
          parsed = urlsplit(raw)
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or any(char.isspace() for char in raw)
          ):
              raise SystemExit("BRIDGE_BASE_URL must be an HTTPS URL without credentials, query, fragment, or whitespace.")
          if not os.environ["BRIDGE_API_KEY"].strip():
              raise SystemExit("BRIDGE_API_KEY must be non-empty.")
          print("Production bridge secret presence and URL shape verified; values were not printed.")
          PY

      - name: Require authenticated execution-ledger health
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="000"
          for attempt in 1 2 3 4 5; do
            http_code="$(curl --silent --show-error --connect-timeout 8 --max-time 20 \
              --output "$response_file" --write-out '%{http_code}' \
              --request GET --header "X-API-Key: ${BRIDGE_API_KEY}" \
              --header "Accept: application/json" \
              "${BRIDGE_BASE_URL%/}/execution-ledger/health" 2>/dev/null || true)"
            if [[ "$http_code" == "200" ]]; then
              break
            fi
            if [[ "$http_code" =~ ^(000|502|503|504)$ && "$attempt" -lt 5 ]]; then
              echo "Authenticated ledger health transport failure (attempt ${attempt}/5); retrying a read-only GET."
              sleep 5
              continue
            fi
            echo "::error::Authenticated execution-ledger health failed with HTTP ${http_code}; no production mutation was attempted."
            exit 1
          done
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Authenticated execution-ledger health never returned HTTP 200."
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  payload = json.load(stream)
          except (OSError, json.JSONDecodeError):
              raise SystemExit("Authenticated execution-ledger health returned invalid JSON.")

          expected = {
              "status": "online",
              "database": "connected",
              "execution_ledger": "ready",
          }
          mismatches = {
              key: payload.get(key)
              for key, value in expected.items()
              if payload.get(key) != value
          }
          if mismatches:
              raise SystemExit(
                  "Authenticated execution-ledger health is degraded; "
                  f"unexpected fields: {', '.join(sorted(mismatches))}. "
                  "Payload values were not printed."
              )
          print("PASS: authenticated bridge key accepted; ledger ready and database SELECT check connected.")
          PY

      - name: Verify unauthenticated execution-ledger access is rejected
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="000"
          for attempt in 1 2 3 4 5; do
            http_code="$(curl --silent --show-error --connect-timeout 8 --max-time 20 \
              --output "$response_file" --write-out '%{http_code}' \
              --request GET --header "Accept: application/json" \
              "${BRIDGE_BASE_URL%/}/execution-ledger/health" 2>/dev/null || true)"
            if [[ "$http_code" =~ ^(401|403|422)$ ]]; then
              echo "PASS: missing X-API-Key was rejected (HTTP ${http_code})."
              exit 0
            fi
            if [[ "$http_code" =~ ^(000|502|503|504)$ && "$attempt" -lt 5 ]]; then
              echo "Unauthenticated ledger check transport failure (attempt ${attempt}/5); retrying a read-only GET."
              sleep 5
              continue
            fi
            echo "::error::Expected a missing-key rejection (401, 403, or 422), received HTTP ${http_code}."
            exit 1
          done
          echo "::error::Unauthenticated execution-ledger check did not complete."
          exit 1

      - name: Require a successful database-backed production health probe
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="000"
          for attempt in 1 2 3 4 5; do
            http_code="$(curl --silent --show-error --connect-timeout 8 --max-time 20 \
              --output "$response_file" --write-out '%{http_code}' \
              --request GET --header "Accept: application/json" \
              "${BRIDGE_BASE_URL%/}/health/db" 2>/dev/null || true)"
            if [[ "$http_code" == "200" ]]; then
              if python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  payload = json.load(stream)
          except (OSError, json.JSONDecodeError):
              raise SystemExit(1)
          if payload.get("status") != "online" or payload.get("database") != "connected":
              raise SystemExit(1)
          print(f"PASS: production service online and database connected; version={payload.get('version', 'unknown')}.")
          PY
              then
                break
              fi
              echo "::error::Database-backed health returned HTTP 200 but did not report online + connected."
              exit 1
            fi
            if [[ "$http_code" =~ ^(000|502|503|504)$ && "$attempt" -lt 5 ]]; then
              echo "Database-backed health transport failure (attempt ${attempt}/5); retrying a read-only GET."
              sleep 5
              continue
            fi
            echo "::error::Database-backed production health failed with HTTP ${http_code}."
            exit 1
          done
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Database-backed health never returned HTTP 200."
            exit 1
          fi

      - name: Record release-gate evidence
        if: success()
        shell: bash
        run: |
          {
            echo "### Production health release gate"
            echo
            echo "- Authenticated execution-ledger health: passed"
            echo "- Missing-key rejection: passed"
            echo "- Database-backed `SELECT 1` health response: passed"
            echo "- No production mutation was performed."
          } >> "$GITHUB_STEP_SUMMARY"
