name: Midas Touch Production Maintenance

on:
  schedule:
    # Recalibration is checked weekly but the UTC parity guard executes every other Saturday.
    - cron: "0 6 * * 6"
    # Subscription enforcement is a separate daily maintenance task.
    - cron: "0 7 * * *"
    # Bounded retry sweep for stale/failed delivery-notification queues.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task to run now (may call the production bridge)
        required: true
        type: choice
        options:
          - biweekly-recalibration
          - daily-subscriptions
          - daily-delivery-recovery
          - execution-ledger-preflight
        default: biweekly-recalibration

permissions:
  contents: read

# Prevent two maintenance runs in this workflow from overlapping.
concurrency:
  group: midas-production-maintenance
  cancel-in-progress: false

jobs:
  execution-ledger-preflight:
    name: Read-only authenticated execution-ledger and database preflight
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.task == 'execution-ledger-preflight' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    concurrency:
      group: midas-execution-ledger-preflight
      cancel-in-progress: false
    steps:
      - name: Validate production bridge secrets without printing them
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BRIDGE_BASE_URL:?BRIDGE_BASE_URL is not configured in workflow}"
          : "${BRIDGE_API_KEY:?Missing GitHub Actions secret BRIDGE_API_KEY}"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          raw = os.environ["BRIDGE_BASE_URL"].strip()
          parsed = urlsplit(raw)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username
                  or parsed.password or parsed.query or parsed.fragment
                  or any(char.isspace() for char in raw)):
              raise SystemExit("BRIDGE_BASE_URL must be an HTTPS URL without credentials, query, fragment, or whitespace.")
          if not os.environ["BRIDGE_API_KEY"].strip():
              raise SystemExit("BRIDGE_API_KEY must be non-empty.")
          print("Bridge secret presence and URL shape verified; secret values not printed.")
          PY

      - name: Verify runtime key and real database connection
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          if ! http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request GET --header "X-API-Key: ${BRIDGE_API_KEY}" \
            --header "Accept: application/json" --connect-timeout 8 --max-time 15 --retry 0 \
            "${BRIDGE_BASE_URL%/}/execution-ledger/health")"; then
            echo "::error::Execution-ledger preflight request failed; no mutation was attempted."
            exit 1
          fi
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Authenticated ledger/database health returned HTTP $http_code; no mutation was attempted."
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              result = json.load(source)
          expected = {"status": "online", "database": "connected", "execution_ledger": "ready"}
          if any(result.get(k) != v for k, v in expected.items()):
              raise SystemExit("Execution-ledger health response is degraded; no mutation was attempted.")
          print("Authenticated bridge API key accepted; database SELECT succeeded; response is healthy.")
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n### Execution-ledger preflight\n\n- Authenticated key verification: passed\n- Database connectivity probe: passed\n- No production mutation was performed.\n")
          PY

  biweekly-recalibration:
    name: Guarded calibration cycle
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 6') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.task == 'biweekly-recalibration') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    concurrency:
      group: midas-production-recalibration
      cancel-in-progress: false
    steps:
      - name: Check alternate-Saturday schedule
        id: parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import date, datetime, timezone
          import os

          scheduled = os.environ.get("GITHUB_EVENT_NAME") == "schedule"
          if not scheduled:
              due = True  # Explicit workflow_dispatch is an operator-authorized run.
              reason = "manual dispatch"
          else:
              anchor = date(2026, 1, 3)  # Saturday parity anchor, UTC.
              today = datetime.now(timezone.utc).date()
              days = (today - anchor).days
              due = today.weekday() == 5 and days >= 0 and ((days // 7) % 2 == 0)
              reason = "eligible alternate Saturday" if due else "off-week Saturday"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"due={'true' if due else 'false'}\n")
          if due:
              print(f"Recalibration window is eligible ({reason}).")
          else:
              print(f"::notice::Recalibration skipped: {reason}; no production endpoint was called.")
          PY

      - name: Validate production bridge secrets
        if: ${{ steps.parity.outputs.due == 'true' }}
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BRIDGE_BASE_URL:?BRIDGE_BASE_URL is not configured in workflow}"
          : "${BRIDGE_API_KEY:?Missing GitHub Actions secret BRIDGE_API_KEY}"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw = os.environ["BRIDGE_BASE_URL"].strip()
          parsed = urlsplit(raw)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username
                  or parsed.password or parsed.query or parsed.fragment
                  or any(char.isspace() for char in raw)):
              raise SystemExit("BRIDGE_BASE_URL must be an HTTPS URL without credentials, whitespace, query, or fragment.")
          if not os.environ["BRIDGE_API_KEY"].strip():
              raise SystemExit("BRIDGE_API_KEY must be non-empty.")
          PY

      - name: Preflight bridge and database health
        if: ${{ steps.parity.outputs.due == 'true' }}
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="000"
          for attempt in 1 2 3 4 5; do
            if http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request GET --connect-timeout 8 --max-time 15 --retry 0 \
              "${BRIDGE_BASE_URL%/}/health/db")"; then
              case "$http_code" in
                2*) break ;;
              esac
            else
              http_code="000"
            fi
            if [[ "$http_code" == "000" || "$http_code" =~ ^5[0-9][0-9]$ ]] && [[ "$attempt" -lt 5 ]]; then
              echo "Bridge health transport/server failure (attempt ${attempt}/5); retrying a read-only GET."
              sleep 5
              continue
            fi
            echo "::error::Bridge health preflight returned HTTP $http_code; no maintenance POST was attempted."
            exit 1
          done
          if [[ "$http_code" != 2* ]]; then
            echo "::error::Bridge health preflight never returned a successful 2xx response; no maintenance POST was attempted."
            exit 1
          fi
          case "$http_code" in
            2*) ;;
            *) echo "::error::Health endpoint returned HTTP $http_code."; exit 1 ;;
          esac
          python3 - "$response_file" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as source:
                  result = json.load(source)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Invalid bridge health JSON: {exc}")
          if result.get("status") != "online" or result.get("database") != "connected":
              raise SystemExit("Bridge/database health is degraded; no maintenance POST was attempted.")
          print(f"Bridge health verified; version={result.get('version', 'unknown')}, database=connected")
          PY

      - name: Run and verify recalibration cycle
        if: ${{ steps.parity.outputs.due == 'true' }}
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          # Do not retry this POST automatically. A replay may create a duplicate
          # calibration cycle for the same live outcome window.
          if ! http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "X-API-Key: ${BRIDGE_API_KEY}" \
            --header "Accept: application/json" \
            --connect-timeout 10 --max-time 120 --retry 0 \
            "${BRIDGE_BASE_URL%/}/admin/run-cycle")"; then
            echo "::error::Unable to reach the calibration endpoint. Inspect bridge logs before manually rerunning; no automatic retry was attempted."
            exit 1
          fi

          case "$http_code" in
            2*) ;;
            *) echo "::error::Calibration endpoint returned HTTP $http_code."; exit 1 ;;
          esac

          python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as response_file:
                  result = json.load(response_file)
          except (OSError, json.JSONDecodeError) as error:
              print(f"::error::Invalid calibration JSON response: {error}")
              raise SystemExit(1)

          status = result.get("status")
          if status != "ok":
              print(
                  "::error::No completed live CalibrationCycle was confirmed "
                  f"(status={status!r}). Investigate recent outcome ingestion and "
                  "registered challenger evaluation; an HTTP 2xx alone is not success."
              )
              raise SystemExit(1)

          cycle_id = result.get("cycle_id")
          if not isinstance(cycle_id, str) or not cycle_id.strip():
              print("::error::Response status was ok but cycle_id was missing or blank.")
              raise SystemExit(1)

          resolved_count = result.get("resolved_count")
          cells = result.get("environment_strategy_memory_cells")
          print("Calibration endpoint verified: status=ok")
          print(f"Persisted cycle id: {cycle_id}")
          print(f"Resolved outcomes: {resolved_count!r}")
          print(f"Environment/strategy memory cells reported: {cells!r}")
          print("This confirms a cycle response, not candidate approval or EA activation.")
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n### Recalibration evidence\n\n")
              summary.write(f"- Cycle ID: `{cycle_id}`\n")
              summary.write(f"- Resolved outcomes: {resolved_count!r}\n")
              summary.write(f"- Environment/strategy memory cells: {cells!r}\n")
              summary.write("- Candidate promotion or EA activation is not implied.\n")
          PY

  daily-subscriptions:
    name: Daily subscription enforcement
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.task == 'daily-subscriptions') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    concurrency:
      group: midas-daily-subscription-enforcement
      cancel-in-progress: false
    steps:
      - name: Validate production bridge secrets
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BRIDGE_BASE_URL:?BRIDGE_BASE_URL is not configured in workflow}"
          : "${BRIDGE_API_KEY:?Missing GitHub Actions secret BRIDGE_API_KEY}"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw = os.environ["BRIDGE_BASE_URL"].strip()
          parsed = urlsplit(raw)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username
                  or parsed.password or parsed.query or parsed.fragment
                  or any(char.isspace() for char in raw)):
              raise SystemExit("BRIDGE_BASE_URL must be an HTTPS URL without credentials, whitespace, query, or fragment.")
          if not os.environ["BRIDGE_API_KEY"].strip():
              raise SystemExit("BRIDGE_API_KEY must be non-empty.")
          PY

      - name: Preflight bridge and database health
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="000"
          for attempt in 1 2 3 4 5; do
            if http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request GET --connect-timeout 8 --max-time 15 --retry 0 \
              "${BRIDGE_BASE_URL%/}/health/db")"; then
              case "$http_code" in
                2*) break ;;
              esac
            else
              http_code="000"
            fi
            if [[ "$http_code" == "000" || "$http_code" =~ ^5[0-9][0-9]$ ]] && [[ "$attempt" -lt 5 ]]; then
              echo "Bridge health transport/server failure (attempt ${attempt}/5); retrying a read-only GET."
              sleep 5
              continue
            fi
            echo "::error::Bridge health preflight returned HTTP $http_code; no maintenance POST was attempted."
            exit 1
          done
          if [[ "$http_code" != 2* ]]; then
            echo "::error::Bridge health preflight never returned a successful 2xx response; no maintenance POST was attempted."
            exit 1
          fi
          case "$http_code" in
            2*) ;;
            *) echo "::error::Health endpoint returned HTTP $http_code."; exit 1 ;;
          esac
          python3 - "$response_file" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as source:
                  result = json.load(source)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Invalid bridge health JSON: {exc}")
          if result.get("status") != "online" or result.get("database") != "connected":
              raise SystemExit("Bridge/database health is degraded; no subscription POST was attempted.")
          print(f"Bridge health verified; version={result.get('version', 'unknown')}, database=connected")
          PY

      - name: Run and verify subscription sweep
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if ! http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "X-API-Key: ${BRIDGE_API_KEY}" \
            --header "Accept: application/json" \
            --connect-timeout 10 --max-time 120 --retry 0 \
            "${BRIDGE_BASE_URL%/}/admin/check-subscriptions")"; then
            echo "::error::Unable to reach the subscription endpoint; no automatic retry was attempted."
            exit 1
          fi

          case "$http_code" in
            2*) ;;
            *) echo "::error::Subscription endpoint returned HTTP $http_code."; exit 1 ;;
          esac

          python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as response_file:
                  result = json.load(response_file)
          except (OSError, json.JSONDecodeError) as error:
              print(f"::error::Invalid subscription response JSON: {error}")
              raise SystemExit(1)

          counts = {}
          for key in ("warned", "expired", "removed"):
              value = result.get(key)
              if isinstance(value, bool) or not isinstance(value, int) or value < 0:
                  print(f"::error::Subscription response missing valid non-negative integer {key!r}.")
                  raise SystemExit(1)
              counts[key] = value

          message = (
              "Subscription sweep verified: "
              f"warned={counts['warned']}, expired={counts['expired']}, removed={counts['removed']}."
          )
          print(message)
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"\n### Subscription maintenance\n\n- {message}\n")
          PY

  daily-delivery-recovery:
    name: Recover failed signal and trade-event delivery notifications
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.task == 'daily-delivery-recovery') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    concurrency:
      group: midas-delivery-recovery
      cancel-in-progress: false
    steps:
      - name: Validate production bridge secrets
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BRIDGE_BASE_URL:?BRIDGE_BASE_URL is not configured in workflow}"
          : "${BRIDGE_API_KEY:?Missing GitHub Actions secret BRIDGE_API_KEY}"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw = os.environ["BRIDGE_BASE_URL"].strip()
          parsed = urlsplit(raw)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username
                  or parsed.password or parsed.query or parsed.fragment
                  or any(char.isspace() for char in raw)):
              raise SystemExit("BRIDGE_BASE_URL must be an HTTPS URL without credentials, whitespace, query, or fragment.")
          if not os.environ["BRIDGE_API_KEY"].strip():
              raise SystemExit("BRIDGE_API_KEY must be non-empty.")
          PY

      - name: Preflight bridge and database health
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="000"
          for attempt in 1 2 3 4 5; do
            if http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request GET --connect-timeout 8 --max-time 15 --retry 0 \
              "${BRIDGE_BASE_URL%/}/health/db")"; then
              case "$http_code" in
                2*) break ;;
              esac
            else
              http_code="000"
            fi
            if [[ "$http_code" == "000" || "$http_code" =~ ^5[0-9][0-9]$ ]] && [[ "$attempt" -lt 5 ]]; then
              echo "Bridge health transport/server failure (attempt ${attempt}/5); retrying a read-only GET."
              sleep 5
              continue
            fi
            echo "::error::Bridge health preflight returned HTTP $http_code; no maintenance POST was attempted."
            exit 1
          done
          if [[ "$http_code" != 2* ]]; then
            echo "::error::Bridge health preflight never returned a successful 2xx response; no maintenance POST was attempted."
            exit 1
          fi
          case "$http_code" in
            2*) ;;
            *) echo "::error::Health endpoint returned HTTP $http_code."; exit 1 ;;
          esac
          python3 - "$response_file" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as source:
                  result = json.load(source)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Invalid bridge health JSON: {exc}")
          if result.get("status") != "online" or result.get("database") != "connected":
              raise SystemExit("Bridge/database is degraded; no recovery POST was attempted.")
          print(f"Recovery preflight passed; version={result.get('version', 'unknown')}")
          PY

      - name: Recover failed or stale delivery notifications
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for route in "/retry-failed" "/trade/retry-failed"; do
            response_file="$(mktemp)"
            if ! http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request POST --header "X-API-Key: ${BRIDGE_API_KEY}" \
              --header "Accept: application/json" --connect-timeout 8 --max-time 60 --retry 0 \
              "${BRIDGE_BASE_URL%/}${route}")"; then
              rm -f "$response_file"
              echo "::error::Recovery request failed for ${route}; no retry was attempted."
              exit 1
            fi
            case "$http_code" in
              2*) ;;
              *) rm -f "$response_file"; echo "::error::Recovery endpoint ${route} returned HTTP $http_code."; exit 1 ;;
            esac
            if ! python3 - "$response_file" "$route" <<'PY'
          import json
          import os
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as source:
                  data = json.load(source)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Invalid recovery response JSON: {exc}")

          route = sys.argv[2]
          if not isinstance(data, dict) or not isinstance(data.get("message"), str):
              raise SystemExit(f"Recovery endpoint {route} returned an invalid response contract")
          counts = (data.get("processed"), data.get("retried"), data.get("remaining_failed"))
          if any(isinstance(value, bool) or not isinstance(value, int) or value < 0 for value in counts):
              raise SystemExit(f"Recovery endpoint {route} omitted valid processed/retried/remaining_failed counts")
          processed, retried, remaining = counts
          if retried > processed:
              raise SystemExit(f"Recovery endpoint {route} reported retried > processed")
          print(f"{route}: processed={processed}, retried={retried}, remaining_failed={remaining}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"- `{route}`: processed={processed}, retried={retried}, remaining failed/stale={remaining}\n")
          if remaining > 0:
              print(f"::error::Recovery backlog remains on {route}; investigate bridge logs and retry policy.")
              raise SystemExit(1)
          PY
            then
              rm -f "$response_file"
              exit 1
            fi
            rm -f "$response_file"
          done
          echo "Delivery queue recovery completed. This job does not reconcile broker/MT5 orders; broker reconciliation remains a separate execution control."
