name: Midas Touch - GitHub to GitLab Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midas-github-to-gitlab-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync GitHub main to GitLab main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout GitHub source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require GitLab synchronization credential
        env:
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_SYNC_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret GITLAB_SYNC_TOKEN."
            echo "Use a GitLab token with write_repository scope (or api + write_repository) that can push to project 86337573."
            exit 1
          fi

      - name: Apply source-tree delta to GitLab
        env:
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # GitLab's repository-files/commits API cannot authenticate with a
          # write_repository-only token. Use Git-over-HTTPS instead, which is
          # the supported write path for that scope. The token stays in a
          # temporary credential file and is never embedded in a remote URL.
          git config --global user.name "midas-sync-bot"
          git config --global user.email "midas-sync-bot@users.noreply.github.com"
          git config --global credential.helper store
          printf 'https://oauth2:%s@gitlab.com\n' "${GITLAB_SYNC_TOKEN}" > "${HOME}/.git-credentials"
          chmod 600 "${HOME}/.git-credentials"
          trap 'rm -f "${HOME}/.git-credentials"' EXIT

          git remote add gitlab https://gitlab.com/midas-touch-group1/midas-touch2.git
          git ls-remote gitlab refs/heads/main >/dev/null
          git fetch --prune gitlab main

          before="${GITHUB_BEFORE}"
          after="${GITHUB_SHA}"
          zero="0000000000000000000000000000000000000000"

          tmp_branch="sync-from-github-${after}"
          git checkout -b "${tmp_branch}" "gitlab/main"

          # The GitHub source of truth intentionally excludes .github/ and the
          # GitLab-owned .gitlab-ci.yml from synchronization. Everything else
          # is applied as a delta, preserving GitLab-only governance state.
          python - <<'PY'
          import os
          import subprocess

          before = os.environ["GITHUB_BEFORE"]
          after = os.environ["GITHUB_SHA"]
          zero = "0" * 40

          if before == zero:
              raw = subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", after],
                  text=True,
              )
              changes = [("A", path) for path in raw.splitlines()]
          else:
              raw = subprocess.check_output(
                  ["git", "diff", "--name-status", "-M", before, after],
                  text=True,
              )
              changes = []
              for line in raw.splitlines():
                  parts = line.split("\t")
                  status = parts[0]
                  if status.startswith("R") and len(parts) == 3:
                      changes.append(("D", parts[1]))
                      changes.append(("M", parts[2]))
                  elif len(parts) >= 2:
                      changes.append((status[0], parts[1]))

          changes = [
              (status, path)
              for status, path in changes
              if path
              and not path.startswith(".github/")
              and path != ".gitlab-ci.yml"
              and not path.startswith(".git/")
          ]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SYNC_CHANGE_COUNT={len(changes)}\n")

          with open("/tmp/midas-sync-actions.tsv", "w", encoding="utf-8") as out:
              for status, path in changes:
                  out.write(f"{status}\t{path}\n")
          PY

          if [ "${SYNC_CHANGE_COUNT}" = "0" ]; then
            echo "SYNC_OK: no source-tree changes require GitLab updates."
            exit 0
          fi

          while IFS=$'\t' read -r status path; do
            [ -n "${path}" ] || continue
            case "${status}" in
              D)
                git rm -f --ignore-unmatch -- "${path}"
                ;;
              A|M)
                git restore --source="${after}" --worktree --staged -- "${path}"
                ;;
              *)
                echo "::error::Unsupported sync status '${status}' for '${path}'."
                exit 1
                ;;
            esac
          done < /tmp/midas-sync-actions.tsv

          if git diff --cached --quiet; then
            echo "SYNC_OK: source delta produced no GitLab tree change."
            exit 0
          fi

          # Hard guard: synchronization must never modify GitLab's own CI
          # definition or import GitHub Actions into the GitLab release surface.
          if git diff --cached --name-only | grep -E '(^|/)\.github/|^\.gitlab-ci\.yml$' >/dev/null; then
            echo "::error::Sync boundary violation: provider-control files would change."
            exit 1
          fi

          git diff --cached --name-status
          git commit -m "chore(sync): GitHub main -> GitLab main"
          git push gitlab HEAD:refs/heads/main

          git fetch --prune gitlab main
          expected="$(git rev-parse HEAD)"
          actual="$(git rev-parse gitlab/main)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::GitLab main verification failed: expected ${expected}, got ${actual}."
            exit 1
          fi

          echo "SYNC_VERIFIED: GitLab main at ${actual}."
