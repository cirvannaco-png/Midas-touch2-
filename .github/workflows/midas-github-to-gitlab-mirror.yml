name: Midas — Manual GitHub to GitLab Mirror

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Development branch to mirror (never main or production)"
        required: true
        type: string
      dry_run:
        description: "Verify ancestry only; do not push"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: midas-github-to-gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Verify and fast-forward GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Validate GitLab credential
        env:
          GITLAB_TOKEN: ${{ secrets.MIDAS_GITLAB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITLAB_TOKEN" || {
            echo "STOP: repository secret MIDAS_GITLAB_TOKEN is not configured."
            exit 1
          }

      - name: Configure GitLab remote
        env:
          GITLAB_TOKEN: ${{ secrets.MIDAS_GITLAB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/midas-touch-group1/midas-touch2-sync.git"

      - name: Run safe sync controller
        env:
          ALLOW_FAST_FORWARD_PUSH: ${{ inputs.dry_run && '0' || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/midas-sync-controller.sh "${{ inputs.ref }}"
