name: Synchronize production bridge authentication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-auth-sync.yml
      - telegram-bridge/scripts/render_sync_secrets.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synchronize-production-auth:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate protected source and Render API credentials
        env:
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-daobbbrtqb8s73elh44g
        shell: bash
        run: |
          set -euo pipefail
          : "${BRIDGE_API_KEY:?Missing protected production secret BRIDGE_API_KEY}"
          : "${RENDER_API_KEY:?Missing protected production secret RENDER_API_KEY}"
          : "${RENDER_SERVICE_ID:?Production Render service ID is not configured}"
          python telegram-bridge/scripts/render_sync_secrets.py --bridge-auth-only --dry-run

      - name: Synchronize Render authentication aliases and redeploy
        env:
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-daobbbrtqb8s73elh44g
        run: python telegram-bridge/scripts/render_sync_secrets.py --bridge-auth-only

      - name: Verify authenticated execution-ledger readiness
        env:
          BRIDGE_BASE_URL: https://midas-touch2.onrender.com
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="000"
          for attempt in $(seq 1 18); do
            if http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request GET --header "X-API-Key: ${BRIDGE_API_KEY}" \
              --header "Accept: application/json" --connect-timeout 8 --max-time 15 --retry 0 \
              "${BRIDGE_BASE_URL%/}/execution-ledger/health")"; then
              if [[ "$http_code" == "200" ]]; then
                break
              fi
            else
              http_code="000"
            fi
            if [[ "$attempt" -lt 18 ]]; then
              echo "Waiting for the Render deployment and authenticated ledger probe (attempt ${attempt}/18; HTTP ${http_code})."
              sleep 5
            fi
          done
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Authenticated execution-ledger health did not return HTTP 200 after deployment; last status was ${http_code}."
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              result = json.load(response)
          expected = {
              "status": "online",
              "database": "connected",
              "execution_ledger": "ready",
          }
          if any(result.get(key) != value for key, value in expected.items()):
              raise SystemExit(
                  "Authenticated execution-ledger health returned HTTP 200 "
                  "but readiness fields did not match the required values."
              )
          print("PASS: HTTP 200; status=online; database=connected; execution_ledger=ready.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(
                  "\n### Production execution-ledger readiness\n\n"
                  "- Authenticated request: HTTP 200\n"
                  "- Bridge status: online\n"
                  "- Database: connected\n"
                  "- Execution ledger: ready\n"
                  "- No trade or ledger mutation was performed.\n"
              )
          PY
