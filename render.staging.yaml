# Staging-only Render Blueprint. Create a NEW Blueprint using this file path.
# Do not sync this file as a replacement for the existing production Blueprint.
services:
  - type: web
    name: midas-touch2-staging
    runtime: docker
    dockerfilePath: ./telegram-bridge/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: ops/staging-private-db-20261018
    autoDeployTrigger: "off"
    healthCheckPath: /health/db

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: midas-touch2-staging-db
          property: connectionString

      # REQUIRED staging-only secrets. Do not reuse the production Telegram
      # bot token: this app registers a webhook and would overwrite the
      # production bot's webhook if the same token were used.
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: WEBHOOK_SECRET_TOKEN
        sync: false

      - key: LOG_LEVEL
        value: "INFO"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "5"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: MAX_REQUEST_BODY_SIZE
        value: "10240"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: TELEGRAM_TIMEOUT_SECONDS
        value: "8"
      - key: TELEGRAM_MAX_RETRIES
        value: "3"
      - key: TELEGRAM_RETRY_MAX_WAIT_SECONDS
        value: "4"
