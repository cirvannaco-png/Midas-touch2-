# Medis Touch GitLab CI/CD
#
# Trading logic is intentionally NOT changed by this migration.
# CI is temporarily manual-only to preserve the remaining GitLab compute minutes.
# Push, merge-request, schedule, API, trigger, and parent/child pipelines are
# suppressed at the workflow level. The audit branch is the one deliberate
# exception used to execute the deterministic correctness patcher.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_REF_NAME == "audit/fix-outcometracker-compiler-parity"'
    - when: never

stages:
  - validate
  - test
  - maintenance
  - deploy-support

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

mql5-structure:
  stage: validate
  image: python:3.11-slim
  script:
    - python tools/validate_mql5.py EA
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_REF_NAME == "audit/fix-outcometracker-compiler-parity"'
      when: manual
      allow_failure: false
    - when: never

architecture-gates:
  stage: validate
  image: python:3.11-slim
  script:
    - python tools/phase_a_d_manifest.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never

medis-touch-python:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files:
        - medis_touch/requirements-dev.txt
      prefix: pip-medis-touch
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - cd medis_touch
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - ruff check app/ tests/
    - bandit -r app/ -q
    - pytest -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never

telegram-bridge:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files:
        - telegram-bridge/requirements-dev.txt
      prefix: pip-telegram-bridge
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - cd telegram-bridge
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - ruff check app/ migrations/ scripts/ tests/
    - bandit -r app/ scripts/ -q
    - |
      BOT_TOKEN="123456:ci-placeholder" \
      CHAT_ID="-1000000000" \
      ADMIN_CHAT_ID="777000777" \
      SECRET_KEY="ci-placeholder-secret" \
      python scripts/render_sync_secrets.py --dry-run
    - |
      BOT_TOKEN="123456:ci-placeholder" \
      CHAT_ID="-1000000000" \
      ADMIN_CHAT_ID="777000777" \
      SECRET_KEY="ci-placeholder-secret" \
      WEBHOOK_SECRET_TOKEN="ci-placeholder-webhook-secret" \
      DATABASE_URL="sqlite+aiosqlite:///./ci_signals.db" \
      RATE_LIMIT_ENABLED="false" \
      pytest -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never

telegram-bridge-dependency-audit:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files:
        - telegram-bridge/requirements-dev.txt
      prefix: pip-telegram-audit
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - cd telegram-bridge
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - pip-audit -r requirements.txt
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never

tools-tests:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files:
        - telegram-bridge/requirements-dev.txt
      prefix: pip-telegram-tools
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - cd telegram-bridge
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - cd ..
    - PYTHONPATH="$PWD/telegram-bridge:$PWD/tools" pytest -v tools/tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never

daily-subscriptions:
  stage: maintenance
  image: alpine:3.22
  before_script:
    - apk add --no-cache curl coreutils
  script:
    - |
      test -n "$BRIDGE_BASE_URL" || { echo "BRIDGE_BASE_URL is required"; exit 1; }
      test -n "$BRIDGE_API_KEY" || { echo "BRIDGE_API_KEY is required"; exit 1; }
      response="$(curl -sS -w '\n%{http_code}' -X POST "${BRIDGE_BASE_URL%/}/admin/check-subscriptions" -H "X-API-Key: ${BRIDGE_API_KEY}" --max-time 120)"
      http_code="$(printf '%s\n' "$response" | tail -n1)"
      body="$(printf '%s\n' "$response" | sed '$d')"
      echo "HTTP $http_code"
      echo "$body"
      test "$http_code" -lt 300
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $SCHEDULE_TASK == "daily-subscriptions"'
      when: manual
    - when: never

biweekly-recalibration:
  stage: maintenance
  image: alpine:3.22
  before_script:
    - apk add --no-cache curl coreutils
  script:
    - |
      test -n "$BRIDGE_BASE_URL" || { echo "BRIDGE_BASE_URL is required"; exit 1; }
      test -n "$BRIDGE_API_KEY" || { echo "BRIDGE_API_KEY is required"; exit 1; }
      FIRST_SATURDAY="2026-01-03"
      TODAY="$(date -u +%Y-%m-%d)"
      DAYS_SINCE="$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$FIRST_SATURDAY" +%s) ) / 86400 ))"
      WEEKS_SINCE="$(( DAYS_SINCE / 7 ))"
      if [ "$CI_PIPELINE_SOURCE" = "web" ] || [ $((WEEKS_SINCE % 2)) -eq 0 ]; then
        response="$(curl -sS -w '\n%{http_code}' -X POST "${BRIDGE_BASE_URL%/}/admin/run-cycle" -H "X-API-Key: ${BRIDGE_API_KEY}" --max-time 120)"
        http_code="$(printf '%s\n' "$response" | tail -n1)"
        body="$(printf '%s\n' "$response" | sed '$d')"
        echo "HTTP $http_code"
        echo "$body"
        test "$http_code" -lt 300
      else
        echo "Skipping: off-week for the biweekly schedule."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $SCHEDULE_TASK == "biweekly-recalibration"'
      when: manual
    - when: never

render-sync-secrets:
  stage: deploy-support
  image: python:3.11-slim
  before_script:
    - cd telegram-bridge
  script:
    - python scripts/render_sync_secrets.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_RENDER_SYNC == "true"'
      when: manual
    - when: never
