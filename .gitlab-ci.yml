# Midas Touch production validation pipeline.
# Validation runs only for main and merge-request pipelines. Feature-branch push
# pipelines are suppressed when an open MR exists, so each change gets one CI run.
# Production deployment is deliberately absent until validation is green.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - validate
  - test

mql5-structure:
  stage: validate
  image: python:3.11-slim
  script:
    - python tools/validate_mql5.py EA

architecture-gates:
  stage: validate
  image: python:3.11-slim
  script:
    - python tools/phase_a_d_manifest.py

medis-touch-python:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files:
        - medis_touch/requirements-dev.txt
      prefix: pip-medis-touch
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - cd medis_touch
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - ruff check app/ tests/
    - bandit -r app/ -q
    - pytest -v

telegram-bridge:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files:
        - telegram-bridge/requirements-dev.txt
      prefix: pip-telegram-bridge
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - cd telegram-bridge
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - ruff check app/ migrations/ scripts/ tests/
    - bandit -r app/ scripts/ -q
    - BOT_TOKEN="123456:ci-placeholder" CHAT_ID="-1000000000" ADMIN_CHAT_ID="777000777" SECRET_KEY="ci-placeholder-secret" python scripts/render_sync_secrets.py --dry-run
    - BOT_TOKEN="123456:ci-placeholder" CHAT_ID="-1000000000" ADMIN_CHAT_ID="777000777" SECRET_KEY="ci-placeholder-secret" WEBHOOK_SECRET_TOKEN="ci-placeholder-webhook-secret" DATABASE_URL="sqlite+aiosqlite:///./ci_signals.db" RATE_LIMIT_ENABLED="false" pytest -v

telegram-bridge-dependency-audit:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files:
        - telegram-bridge/requirements-dev.txt
      prefix: pip-telegram-audit
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - cd telegram-bridge
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - pip-audit -r requirements.txt

tools-tests:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files:
        - telegram-bridge/requirements-dev.txt
      prefix: pip-telegram-tools
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - cd telegram-bridge
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - cd ..
    - PYTHONPATH="$PWD/telegram-bridge:$PWD/tools" pytest -v tools/tests
