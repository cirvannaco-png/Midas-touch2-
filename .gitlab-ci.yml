workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

stages:
  - validate
  - test
  - maintenance

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Keep scheduled maintenance pipelines lean: they should run the maintenance
# task only, not the full validation/test suite before reaching the API call.
mql5-structure:
  stage: validate
  image: python:3.11-slim
  script:
    - python tools/validate_mql5.py EA
    - python tools/validate_edge_lineage.py
    - python tools/phase_a_d_manifest.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $SCHEDULE_TASK == "biweekly-recalibration"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: on_success

governance-tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - python -m pip install --disable-pip-version-check -r medis_touch/requirements-dev.txt
    - python -m pip install --disable-pip-version-check -r telegram-bridge/requirements-dev.txt
  script:
    - ruff check medis_touch/app/ medis_touch/tests/
    - bandit -r medis_touch/app/ -q
    - PYTHONPATH="$CI_PROJECT_DIR" pytest -v medis_touch/tests/test_prediction_governance.py
    - PYTHONPATH="$CI_PROJECT_DIR/telegram-bridge:$CI_PROJECT_DIR/tools" pytest -v tools/tests
    - ruff check telegram-bridge/app/ telegram-bridge/migrations/ telegram-bridge/scripts/ telegram-bridge/tests/
    - bandit -r telegram-bridge/app/ telegram-bridge/scripts/ -q
    - BOT_TOKEN="123456:ci-placeholder" CHAT_ID="-1000000000" ADMIN_CHAT_ID="777000777" SECRET_KEY="ci-placeholder-secret" python telegram-bridge/scripts/render_sync_secrets.py --dry-run
    - BOT_TOKEN="123456:ci-placeholder" CHAT_ID="-1000000000" ADMIN_CHAT_ID="777000777" SECRET_KEY="ci-placeholder-webhook-secret" WEBHOOK_SECRET_TOKEN="ci-placeholder-webhook-secret" DATABASE_URL="sqlite+aiosqlite:///./ci_signals.db" RATE_LIMIT_ENABLED="false" bash -lc 'set -e; for test_file in telegram-bridge/tests/test_*.py; do echo "=== $test_file ==="; pytest -v "$test_file"; done'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $SCHEDULE_TASK == "biweekly-recalibration"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: on_success

medis-touch-python:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files:
        - medis_touch/requirements-dev.txt
      prefix: pip-medis-touch
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - cd medis_touch
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - ruff check app/ tests/
    - bandit -r app/ -q
    - PYTHONPATH="$CI_PROJECT_DIR" pytest -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $SCHEDULE_TASK == "biweekly-recalibration"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: on_success

telegram-bridge-dependency-audit:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd telegram-bridge
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - pip-audit -r requirements.txt
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $SCHEDULE_TASK == "biweekly-recalibration"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: on_success

biweekly-recalibration:
  stage: maintenance
  image: alpine:3.21
  before_script:
    - apk add --no-cache ca-certificates curl python3
  script:
    - |
      set -eu
      : "${BRIDGE_BASE_URL:?Missing protected/masked BRIDGE_BASE_URL CI/CD variable}"
      : "${BRIDGE_API_KEY:?Missing protected/masked BRIDGE_API_KEY CI/CD variable}"
      case "$BRIDGE_BASE_URL" in
        https://*) ;;
        *) echo "BRIDGE_BASE_URL must use HTTPS"; exit 2 ;;
      esac

      # Scheduled jobs run every Saturday but execute only on alternate
      # Saturdays, anchored to 2026-01-03. Manual web runs intentionally bypass
      # the parity guard so operators can request an immediate cycle.
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        due="$(python3 - <<'PY'
      from datetime import date, datetime, timezone
      anchor = date(2026, 1, 3)  # Saturday parity anchor
      today = datetime.now(timezone.utc).date()
      days = (today - anchor).days
      should_run = today.weekday() == 5 and days >= 0 and ((days // 7) % 2 == 0)
      print("run" if should_run else "skip")
      PY
      )"
        if [ "$due" != "run" ]; then
          echo "Recalibration skipped: this is the off-week Saturday (UTC parity guard)."
          exit 0
        fi
      fi

      response_file="$(mktemp)"
      trap 'rm -f "$response_file"' EXIT
      # This POST is intentionally not retried automatically: replaying it can
      # create duplicate calibration cycles from the same outcome window. On a
      # transport failure, inspect bridge logs before manually rerunning the job.
      http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
        --request POST \
        --header "X-API-Key: ${BRIDGE_API_KEY}" \
        --header "Content-Type: application/json" \
        --connect-timeout 10 --max-time 120 \
        "${BRIDGE_BASE_URL%/}/admin/run-cycle")"
      cat "$response_file"
      printf '\nRecalibration endpoint HTTP status: %s\n' "$http_code"
      case "$http_code" in
        2*) ;;
        *) echo "Recalibration cycle failed; inspect the bridge logs and CI response above."; exit 1 ;;
      esac
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SCHEDULE_TASK == "biweekly-recalibration"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SCHEDULE_TASK == "biweekly-recalibration"'
    - when: never
