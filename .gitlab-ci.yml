workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

stages:
  - validate
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

mql5-structure:
  stage: validate
  image: python:3.11-slim
  script:
    - python tools/validate_mql5.py EA
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(push|merge_request_event|web|api)$/'

architecture-gates:
  stage: validate
  image: python:3.11-slim
  script:
    - python tools/phase_a_d_manifest.py
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(push|merge_request_event|web|api)$/'

medis-touch-python:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files: [medis_touch/requirements-dev.txt]
      prefix: pip-medis-touch
    paths: [.cache/pip]
    policy: pull-push
  before_script:
    - cd medis_touch
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - ruff check app/ tests/
    - bandit -r app/ -q
    - pytest -v
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(push|merge_request_event|web|api)$/'

telegram-bridge:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files: [telegram-bridge/requirements-dev.txt]
      prefix: pip-telegram-bridge
    paths: [.cache/pip]
    policy: pull-push
  before_script:
    - cd telegram-bridge
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - ruff check app/ migrations/ scripts/ tests/
    - bandit -r app/ scripts/ -q
    - |
      BOT_TOKEN="123456:ci-placeholder" CHAT_ID="-1000000000" ADMIN_CHAT_ID="777000777" SECRET_KEY="ci-placeholder-secret" WEBHOOK_SECRET_TOKEN="ci-placeholder-webhook-secret" DATABASE_URL="sqlite+aiosqlite:///./ci_signals.db" RATE_LIMIT_ENABLED="false" pytest -v
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(push|merge_request_event|web|api)$/'

tools-tests:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files: [telegram-bridge/requirements-dev.txt]
      prefix: pip-tools
    paths: [.cache/pip]
    policy: pull-push
  before_script:
    - cd telegram-bridge
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - cd ..
    - PYTHONPATH="$PWD/telegram-bridge:$PWD/tools" pytest -v tools/tests
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(push|merge_request_event|web|api)$/'

# MetaEditor compilation remains a mandatory release gate. Linux runners
# cannot execute MetaEditor or the MT5 Strategy Tester, so CI explicitly
# refuses to treat the structural validator as an MQL5 compiler.
